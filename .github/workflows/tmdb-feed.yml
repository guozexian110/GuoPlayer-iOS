name: Update TMDb discovery feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check feed builder without a real credential
        run: python3 iOS/tools/test_tmdb_feed.py
      - name: Fetch current TMDb lists
        id: fetch
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ]; then
            echo 'TMDB_READ_TOKEN secret is not configured yet'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 iOS/tools/build_tmdb_feed.py
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.fetch.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.ready == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.fetch.outputs.ready == 'true'
        id: deploy
